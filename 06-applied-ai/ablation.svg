<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="Each safety layer removes errors that would reach the TMS"><style>
.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.grid{stroke:#e4e3df}.axis{stroke:#a3a29c}
.s1{fill:#2a78d6;stroke:#2a78d6}.s2{fill:#eb6834;stroke:#eb6834}.s3{fill:#1baf7a;stroke:#1baf7a}
.s4{fill:#eda100;stroke:#eda100}.s5{fill:#e87ba4;stroke:#e87ba4}.muted{fill:#a3a29c;stroke:#a3a29c}
text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#f0efec}.ink2{fill:#c3c2b7}
.grid{stroke:#383835}.axis{stroke:#6b6a64}.s1{fill:#3987e5;stroke:#3987e5}.s2{fill:#d95926;stroke:#d95926}
.s3{fill:#199e70;stroke:#199e70}.s4{fill:#c98500;stroke:#c98500}.s5{fill:#d55181;stroke:#d55181}
.muted{fill:#6b6a64;stroke:#6b6a64}}
</style><rect class="bg" width="720" height="330" rx="8"/><text class="ink" x="24" y="34" font-size="17" font-weight="600">Each safety layer removes errors that would reach the TMS</text><line x1="70" y1="260" x2="670" y2="260" class="axis"/><rect x="90" y="80.0" width="110" height="180.0" rx="4" class="s1"/><text class="ink" x="145.0" y="72.0" font-size="12" text-anchor="middle" font-weight="600">36 escapes</text><text class="ink" x="145.0" y="280.0" font-size="12" text-anchor="middle" font-weight="600">A</text><text class="ink2" x="145.0" y="296.0" font-size="10.5" text-anchor="middle" font-weight="400">extraction only</text><text class="ink2" x="145.0" y="312.0" font-size="10.5" text-anchor="middle" font-weight="400">95% straight-through</text><rect x="240" y="190.0" width="110" height="70.0" rx="4" class="s1"/><text class="ink" x="295.0" y="182.0" font-size="12" text-anchor="middle" font-weight="600">14 escapes</text><text class="ink" x="295.0" y="280.0" font-size="12" text-anchor="middle" font-weight="600">B</text><text class="ink2" x="295.0" y="296.0" font-size="10.5" text-anchor="middle" font-weight="400">+ confidence threshold</text><text class="ink2" x="295.0" y="312.0" font-size="10.5" text-anchor="middle" font-weight="400">81% straight-through</text><rect x="390" y="205.0" width="110" height="55.0" rx="4" class="s1"/><text class="ink" x="445.0" y="197.0" font-size="12" text-anchor="middle" font-weight="600">11 escapes</text><text class="ink" x="445.0" y="280.0" font-size="12" text-anchor="middle" font-weight="600">C</text><text class="ink2" x="445.0" y="296.0" font-size="10.5" text-anchor="middle" font-weight="400">+ single-document rule</text><text class="ink2" x="445.0" y="312.0" font-size="10.5" text-anchor="middle" font-weight="400">80% straight-through</text><rect x="540" y="260.0" width="110" height="1.5" rx="4" class="s1"/><text class="ink" x="595.0" y="252.0" font-size="12" text-anchor="middle" font-weight="600">0 escapes</text><text class="ink" x="595.0" y="280.0" font-size="12" text-anchor="middle" font-weight="600">D</text><text class="ink2" x="595.0" y="296.0" font-size="10.5" text-anchor="middle" font-weight="400">+ cross-document rules</text><text class="ink2" x="595.0" y="312.0" font-size="10.5" text-anchor="middle" font-weight="400">70% straight-through</text><text class="ink2" x="24.0" y="58.0" font-size="11" text-anchor="start" font-weight="400">Test set, 220 documents. An escape is a document that reached the TMS with an error nobody was asked to check.</text></svg>
