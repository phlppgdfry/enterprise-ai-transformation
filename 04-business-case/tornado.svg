</style><rect class="bg" width="760" height="448" rx="8"/><text class="ink" x="24" y="34" font-size="17" font-weight="600">What moves the 3-year NPV (cash view) most</text><line x1="572.1" y1="78" x2="572.1" y2="384" class="axis" stroke-width="1.5"/><text class="ink" x="572.1" y="436.0" font-size="11" text-anchor="middle" font-weight="600">Base NPV €189k</text><text class="ink" x="340.0" y="103.0" font-size="11" text-anchor="end" font-weight="400">Doc desk leavers per year not replaced</text><rect x="376.2" y="90" width="195.9" height="18" rx="3" class="s2"/><rect x="572.1" y="90" width="74.1" height="18" rx="3" class="s1"/><text class="ink" x="340.0" y="133.0" font-size="11" text-anchor="end" font-weight="400">Cost of one error that reaches operations</text><rect x="506.3" y="120" width="65.8" height="18" rx="3" class="s2"/><rect x="572.1" y="120" width="131.7" height="18" rx="3" class="s1"/><text class="ink" x="340.0" y="163.0" font-size="11" text-anchor="end" font-weight="400">Documents with a keying error today</text><rect x="512.4" y="150" width="59.7" height="18" rx="3" class="s2"/><rect x="572.1" y="150" width="69.7" height="18" rx="3" class="s1"/><text class="ink" x="340.0" y="193.0" font-size="11" text-anchor="end" font-weight="400">One-off cost: production build, TMS integration, chang</text><rect x="572.1" y="180" width="25.6" height="18" rx="3" class="s2"/><rect x="520.9" y="180" width="51.2" height="18" rx="3" class="s1"/><text class="ink" x="340.0" y="223.0" font-size="11" text-anchor="end" font-weight="400">Minutes to key one document today</text><rect x="532.4" y="210" width="39.7" height="18" rx="3" class="s2"/><rect x="572.1" y="210" width="27.0" height="18" rx="3" class="s1"/><text class="ink" x="340.0" y="253.0" font-size="11" text-anchor="end" font-weight="400">Documents keyed per month</text><rect x="539.2" y="240" width="32.9" height="18" rx="3" class="s2"/><rect x="572.1" y="240" width="32.9" height="18" rx="3" class="s1"/><text class="ink" x