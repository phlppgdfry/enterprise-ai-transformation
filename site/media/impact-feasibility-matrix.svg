ass="ink" font-size="12" font-weight="600" transform="translate(28 270.0) rotate(-90)" text-anchor="middle">Value (money and strategic fit)</text><text class="ink2" x="694.0" y="86.0" font-size="11" text-anchor="end" font-weight="600">Do now</text><text class="ink2" x="86.0" y="86.0" font-size="11" text-anchor="start" font-weight="600">Prepare (strategic bet)</text><text class="ink2" x="694.0" y="462.0" font-size="11" text-anchor="end" font-weight="600">Fill-in</text><text class="ink2" x="86.0" y="462.0" font-size="11" text-anchor="start" font-weight="600">Deprioritise</text><circle cx="483.0" cy="164.0" r="10.5" class="s1" fill-opacity="0.85" stroke="#fcfcfb" stroke-width="2"/><text class="ink" x="499.5" y="168.0" font-size="11" text-anchor="start" font-weight="400">UC-01 Freight document intelligence</text><circle cx="506.2" cy="326.0" r="11.4" class="s1" fill-opacity="0.85" stroke="#fcfcfb" stroke-width="2"/><text class="ink" x="518.2" y="330.0" font-size="11" text-anchor="start" font-weight="400">UC-09 Carrier invoice audit</text><circle cx="483.0" cy="285.0" r="10.2" class="s1" fill-opacity="0.85" stroke="#fcfcfb" stroke-width="2"/><text class="ink" x="499.2" y="289.0" font-size="11" text-anchor="start" font-weight="400">UC-02 E-mail triage and drafts</text><circle cx="289.2" cy="201.0" r="10.5" class="s1" fill-opacity="0.85" stroke="#fcfcfb" stroke-width="2"/><text class="ink" x="305.8" y="205.0" font-size="11" text-anchor="start" font-weight="400">UC-07 Route and load optimisation</text><circle cx="390.0" cy="234.0" r="9.6" class="s1" fill-opacity="0.85" stroke="#fcfcfb" stroke-width="2"/><text class="ink" x="405.6" y="238.0" font-size="11" text-anchor="start" font-weight="400">UC-03 Customs classification</text><circle cx="428.8" cy="307.0" r="10.5" class="s1" fill-opacity="0.85" stroke="#fcfcfb" stroke-width="2"/><text class="ink" x="440.8" y="305.0" font-size="11" text-anchor="start" font-weight="400">UC-10 Quote and tender assistant</text><circle cx="413.