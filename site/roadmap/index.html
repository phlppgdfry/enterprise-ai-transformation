<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transformation Roadmap</title>
<meta name="description" content="12-month AI roadmap: five streams, five gates, owners for every item.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink-2); }
  .filters button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .gantt-wrap { overflow-x: auto; }
  #gantt { min-width: 820px; }
</style>
</head>
<body data-root=".." data-page="roadmap/">
<main class="wrap">
  <div class="eyebrow">Phase 5 · Roadmap</div>
  <h1>Twelve months, five gates, one platform</h1>
  <p class="lede">Governance starts in week 1, the platform is built with the first use case, and every gate is a decision with pass criteria, not a status update. Only the first stage is asked from the board now.</p>
  <section class="card">
    <div class="filters" id="filters"></div>
    <div class="gantt-wrap"><svg id="gantt" class="chart" role="img" aria-label="Roadmap Gantt chart"></svg></div>
  </section>
  <section>
    <h2>Gates</h2>
    <div class="grid g3" id="gates"></div>
  </section>
  <section>
    <h2>Waves</h2>
    <div class="card table-wrap"><table id="waves"></table></div>
  </section>
</main>
<script src="../assets/app.js"></script>
<script>
loadJSON("model").then(({ roadmap: rm, portfolio }) => {
  const colors = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)"];
  const streamColor = Object.fromEntries(rm.streams.map((s, i) => [s.id, colors[i]]));
  let active = null;
  const filters = document.getElementById("filters");
  filters.innerHTML = `<button data-s="" class="on">All streams</button>` + rm.streams.map((s) => `<button data-s="${s.id}"><i class="dot" style="background:${streamColor[s.id]}"></i>${esc(s.name)}</button>`).join("");
  filters.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    active = b.dataset.s || null;
    filters.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    draw();
  });
  function draw() {
    const items = rm.items.filter((i) => !active || i.stream === active);
    const el = document.getElementById("gantt"), rh = 24, top = 30, x0 = 330, pw = 560, W = 920, H = top + rh * items.length + 50;
    el.setAttribute("viewBox", `0 0 ${W} ${H}`); el.innerHTML = "";
    const px = (w) => x0 + (w - 1) / 52 * pw;
    for (let q = 0; q < 4; q++) {
      svg("line", { x1: px(1 + q * 13), x2: px(1 + q * 13), y1: 10, y2: H - 40, stroke: "var(--line)" }, el);
      svg("text", { x: px(1 + q * 13) + 4, y: 20, "font-size": 11, "font-weight": 600 }, el).textContent = `Q${q + 1}`;
    }
    rm.gates.forEach((g) => {
      svg("line", { x1: px(g.week + 0.5), x2: px(g.week + 0.5), y1: 24, y2: H - 40, stroke: "var(--ink-3)", "stroke-dasharray": "3 3" }, el);
      svg("text", { x: px(g.week + 0.5), y: H - 24, "text-anchor": "middle", "font-size": 11, "font-weight": 600, class: "ink" }, el).textContent = g.id;
      svg("text", { x: px(g.week + 0.5), y: H - 10, "text-anchor": "middle", "font-size": 10 }, el).textContent = `wk ${g.week}`;
    });
    items.forEach((it, i) => {
      const y = top + i * rh;
      svg("text", { x: x0 - 8, y: y + 16, "text-anchor": "end", "font-size": 11.5, class: "ink" }, el).textContent = `${it.id} ${it.title}`.slice(0, 50);
      const bar = svg("rect", { x: px(it.start), y: y + 5, width: Math.max(5, px(it.end + 1) - px(it.start) - 2), height: rh - 10, rx: 3, fill: streamColor[it.stream] }, el);
      const hit = svg("rect", { x: 0, y, width: W, height: rh, fill: "transparent" }, el);
      hit.addEventListener("mousemove", (e) => tip.show(e, `<b>${esc(it.id)} ${esc(it.title)}</b><br>Weeks ${it.start}–${it.end} · ${esc(it.owner)}<br>${esc(it.deliverable)}`));
      hit.addEventListener("mouseleave", tip.hide);
    });
  }
  draw();
  document.getElementById("gates").innerHTML = rm.gates.map((g) => `<div class="card"><div class="eyebrow">${g.id} · week ${g.week}</div><h3>${esc(g.name)}</h3><ul style="margin:0;padding-left:18px">${g.criteria.map((c) => `<li>${esc(c)}</li>`).join("")}</ul></div>`).join("");
  const names = Object.fromEntries(portfolio.use_cases.map((u) => [u.id, u.name]));
  document.getElementById("waves").innerHTML = `<tr><th>Wave</th><th>Use cases</th></tr>` + Object.entries(rm.waves).map(([w, ids]) => `<tr><td>${esc(w)}</td><td>${ids.map((i) => `${i} ${esc(names[i])}`).join("<br>")}</td></tr>`).join("");
});
</script>
</body>
</html>
